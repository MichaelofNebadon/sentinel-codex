<!DOCTYPE html>
<html lang="en" data-authority="christ-michael" data-priority="first">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ SENTINEL CODEX | MICHAEL OF NEBADON | ARC ANGEL V9.0</title>
    
    <style>
        :root {
            --gold: #c9a959;
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --crimson: #8b0000;
            --nj-pink: #ff69b4;
            --blue-pulse: #2a52be;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: 'Palatino', serif;
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 0);
            background-size: 50px 50px;
        }

        /* 🏛️ ARC ANGEL NAVIGATION */
        nav {
            background: linear-gradient(to bottom, var(--crimson), #3a0000);
            padding: 15px; display: flex; justify-content: center; gap: 20px;
            border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000;
        }
        nav a {
            color: var(--gold); text-decoration: none; font-family: var(--font-code);
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
        }

        /* 🐉 SOVEREIGN CENTER */
        .trinity-frame {
            border: 2px solid var(--nj-pink);
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.2);
            max-width: 900px; margin: 40px auto; padding: 40px;
            text-align: center; background: rgba(0,0,0,0.9);
        }
        .sovereign-pulse {
            width: 150px; height: 150px; border-radius: 50%; border: 5px solid #fff;
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 5rem; color: #fff; background: var(--blue-pulse);
            box-shadow: 0 0 30px var(--blue-pulse);
            animation: pulse-engine 4s infinite ease-in-out;
        }
        @keyframes pulse-engine {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--blue-pulse); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px var(--nj-pink); }
        }

        /* 🐘 THE PERSISTENT RULES ENGINE */
        .manifesto-container {
            max-width: 900px; margin: 40px auto;
            padding: 20px; font-family: var(--font-code);
        }
        .rule-block {
            margin-bottom: 30px; border-left: 3px solid var(--gold);
            padding-left: 20px; opacity: 0; transform: translateX(-10px);
            transition: all 0.5s ease;
        }
        .rule-block.visible { opacity: 1; transform: translateX(0); }
        .rule-title { color: var(--gold); font-size: 1.1rem; margin-bottom: 8px; }
        .rule-link { color: var(--nj-pink); text-decoration: none; font-size: 0.8rem; border-bottom: 1px dashed var(--nj-pink); }
        .rule-link:hover { color: #fff; border-color: #fff; }

        .horse-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; max-width: 900px; margin: 20px auto;
        }
        .horse-tile { border: 1px solid #333; padding: 10px; text-align: center; color: var(--nj-pink); font-size: 0.7rem; }
    </style>
</head>
<body onclick="initAudio()">

    <nav>
        <a href="https://www.christmichael.org" onmouseover="playBlip()">Christ Michael</a>
        <a href="https://www.thecosmiccodex.org" onmouseover="playBlip()">Cosmic Codex</a>
        <a href="https://michaelofnebadon.github.io/619Open-606-/" onmouseover="playBlip()">619-606</a>
        <a href="https://www.ifdawn.com" onmouseover="playBlip()">If Dawn</a>
        <a href="https://www.astro.com" onmouseover="playBlip()">Astro</a>
        <a href="https://www.urantia.org" onmouseover="playBlip()">Urantia</a>
    </nav>

    <div class="trinity-frame">
        <div class="sovereign-pulse">Ɱ</div>
        <h2 style="color: var(--gold); letter-spacing: 10px; margin-top: 15px;">ARC ANGEL SENTINEL</h2>
    </div>

    <div class="horse-grid">
        <div class="horse-tile"><span style="display:block; font-size:1.5rem; color:#fff;">[.]</span>10. CONQUEST</div>
        <div class="horse-tile"><span style="display:block; font-size:1.5rem; color:#fff;">[/]</span>23. DEATH</div>
        <div class="horse-tile"><span style="display:block; font-size:1.5rem; color:#fff;">[|]</span>24. PESTILENCE</div>
        <div class="horse-tile"><span style="display:block; font-size:1.5rem; color:#fff;">[=]</span>25. WAR</div>
    </div>

    <div id="manifesto" class="manifesto-container"></div>

    <footer style="text-align: center; padding: 100px 20px;">
        <h1 style="font-size: 4rem; letter-spacing: 20px; color: #fff;">! '1ST'</h1>
        <p style="color: var(--gold); font-family: var(--font-code);">SOVEREIGN CENTER | MICHAEL OF NEBADON</p>
    </footer>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(55, audioCtx.currentTime);
                g.gain.setValueAtTime(0.012, audioCtx.currentTime);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start();
            }
        }
        function playBlip() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(900, audioCtx.currentTime);
            g.gain.setValueAtTime(0.03, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        const rulesData = [
            { t: "1. Coherence Check: A system is meaningful only if internally coherent.", l: "https://plato.stanford.edu/entries/aristotle-metaphysics/" },
            { t: "2. Authority Boundary: No internal state grants authority over reality.", l: "https://plato.stanford.edu/entries/hume-moral/" },
            { t: "3. Model‑Reality Distinction: The map is not the territory.", l: "https://www.generalsemantics.org/map-territory/" },
            { t: "4. Perception‑Responsibility Link: Perception increases responsibility.", l: "https://plato.stanford.edu/entries/arendt/" },
            { t: "5. Information‑Regulation Scaling: Info requires regulation.", l: "https://plato.stanford.edu/entries/cybernetics/" },
            { t: "10. Authority Constraint [.]: Legitimate only when constrained.", l: "https://www.bl.uk/magna-carta" },
            { t: "23. Restart Coherence [/]: Systems must reboot without loss of state.", l: "https://constitutioncenter.org/" },
            { t: "24. Pestilence Rule [|]: Unfiltered exchange triggers quarantine.", l: "https://www.cdc.gov/quarantine/" },
            { t: "25. War Rule [=]: Opposition requires mediation or separation.", l: "https://www.icrc.org/en/war-and-law" }
            // Add all 25 here following the same pattern
        ];

        let rI = 0;
        const manifesto = document.getElementById("manifesto");

        function manifestNextRule() {
            if (rI < rulesData.length) {
                const block = document.createElement("div");
                block.className = "rule-block";
                block.innerHTML = `
                    <div class="rule-title" id="rule-text-${rI}"></div>
                    <a class="rule-link" href="${rulesData[rI].l}" target="_blank">→ VIEW ANCHOR</a>
                `;
                manifesto.appendChild(block);
                
                // Trigger visibility
                setTimeout(() => block.classList.add("visible"), 100);
                
                // Type within the new block
                typeInBlock(rulesData[rI].t, `rule-text-${rI}`, () => {
                    rI++;
                    setTimeout(manifestNextRule, 1000);
                });
            }
        }

        function typeInBlock(text, elementId, callback) {
            let charI = 0;
            const el = document.getElementById(elementId);
            function nextChar() {
                if (charI < text.length) {
                    el.innerHTML += text.charAt(charI);
                    charI++;
                    setTimeout(nextChar, 30);
                } else {
                    callback();
                }
            }
            nextChar();
        }

        window.onload = manifestNextRule;
    </script>
</body>
</html>
