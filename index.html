<!DOCTYPE html>
<html lang="en" data-authority="christ-michael" data-priority="first">
<head>
    <meta charset="UTF-8">
    <title>🛡️ SENTINEL CODEX | ARC ANGEL V14.0 | SUPREME CIRCUIT</title>
    <style>
        :root {
            --gold-tipheret: #ffcf40;
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --nj-pink: #ff69b4;
            --blue-pulse: #2a52be;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: 'Palatino', serif;
            background-image: radial-gradient(circle, #222 1px, transparent 0);
            background-size: 60px 60px;
        }

        /* 🏛️ SOVEREIGN NAVIGATION */
        nav {
            background: linear-gradient(to bottom, #8b0000, #3a0000);
            padding: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;
            border-bottom: 3px solid var(--gold-tipheret); position: sticky; top: 0; z-index: 1000;
        }
        nav a {
            color: var(--gold-tipheret); text-decoration: none; font-family: var(--font-code);
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; padding: 5px;
        }
        nav a:hover { color: #fff; text-shadow: 0 0 10px var(--nj-pink); }

        .trinity-frame {
            border: 3px solid var(--gold-tipheret);
            box-shadow: 0 0 60px rgba(255, 207, 64, 0.3);
            max-width: 950px; margin: 40px auto; padding: 50px;
            text-align: center; background: rgba(0,0,0,0.95);
        }

        .sovereign-pulse {
            width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--gold-tipheret);
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 6rem; color: var(--gold-tipheret); background: var(--blue-pulse);
            box-shadow: 0 0 40px var(--blue-pulse); animation: tipheret-pulse 5s infinite ease-in-out;
        }

        @keyframes tipheret-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--gold-tipheret); }
            50% { transform: scale(1.05); box-shadow: 0 0 70px var(--nj-pink); }
        }

        .manifesto-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .rule-block {
            margin-bottom: 25px; border-left: 4px solid var(--gold-tipheret);
            padding-left: 25px; opacity: 0; transform: translateY(10px);
            transition: all 0.5s ease-out;
        }
        .rule-block.visible { opacity: 1; transform: translateY(0); }
        .rule-title { color: var(--gold-tipheret); font-size: 1.1rem; margin-bottom: 5px; font-weight: bold; }
        .rule-link { color: var(--nj-pink); text-decoration: none; font-size: 0.8rem; border: 1px solid var(--nj-pink); padding: 3px 7px; }
        .rule-link:hover { background: var(--gold-tipheret); color: #000; }
    </style>
</head>
<body onclick="initAudio()">

    <nav>
        <a href="https://christmichael.org">ChristMichael.org</a>
        <a href="https://thecosmiccodex.org">TheCosmicCodex.org</a>
        <a href="https://michaelofnebadon.github.io/619Open-606-/">619Open-606-</a>
        <a href="https://www.ifdawn.com/">IfDawn.com</a>
        <a href="https://www.urantia.org">Urantia.org</a>
        <a href="https://www.astro.com">Astro.com</a>
    </nav>

    <div class="trinity-frame">
        <div class="sovereign-pulse">Ⓜ️</div>
        <h1 style="color: var(--gold-tipheret); letter-spacing: 15px; margin-top: 20px;">ARC ANGEL 1st</h1>
    </div>

    <div id="manifesto" class="manifesto-container"></div>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(55, audioCtx.currentTime);
                g.gain.setValueAtTime(0.012, audioCtx.currentTime);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start();
            }
        }

        const rulesData = [
            { t: "1. Coherence Check: System meaningful only if internally coherent.", l: "https://plato.stanford.edu/entries/aristotle-metaphysics/" },
            { t: "2. Authority Boundary: No internal state grants authority over reality.", l: "https://plato.stanford.edu/entries/hume-moral/" },
            { t: "3. Model‑Reality Distinction [Ⓜ️]: Map is not Territory.", l: "https://generalsemantics.org/Map-is-not-the-Territory" },
            { t: "4. Perception‑Responsibility Link: Perception increases responsibility.", l: "https://plato.stanford.edu/entries/arendt/" },
            { t: "5. Information‑Regulation Scaling: Info requires regulation.", l: "https://plato.stanford.edu/entries/information/" },
            { t: "6. Multi‑Input Integration: Inputs require integration before action.", l: "https://plato.stanford.edu/entries/systems-theory/" },
            { t: "7. Completion Condition Mandate: Unfinished action produces instability.", l: "https://plato.stanford.edu/entries/thermodynamics/" },
            { t: "8. Pre‑Execution Criteria [Ⓜ️]: Definitions must precede execution.", l: "https://plato.stanford.edu/entries/logic-ontology/" },
            { t: "9. Restraint as Function: Restraint is a functional requirement.", l: "https://ctext.org/dao-de-jing" },
            { t: "10. Authority Constraint [Ⓜ️]: Authority bound by Law.", l: "https://plato.stanford.edu/entries/rule-of-law/" },
            { t: "11. Ethical Power Test: Power is the ability to refrain from action.", l: "https://plato.stanford.edu/entries/ethics-belief/" },
            { t: "12. Responsibility‑Capacity Scaling: Responsibility scales with capacity.", l: "https://plato.stanford.edu/entries/fiduciary-duty/" },
            { t: "13. Open‑System Boundaries [Ⓜ️]: Boundaries maintain system order.", l: "https://plato.stanford.edu/entries/boundary-logic/" },
            { t: "14. Stability‑Before‑Expansion: Stability precedes expansion.", l: "https://www.simplypsychology.org/maslow.html" },
            { t: "15. Integration‑Before‑Transformation [Ⓜ️]: Inner unity precedes change.", l: "https://plato.stanford.edu/entries/identity-personal/" },
            { t: "16. Non‑Interchangeability: Individual configurations are not interchangeable.", l: "https://plato.stanford.edu/entries/kant-moral/" },
            { t: "17. Uniqueness‑Superiority Separation: Uniqueness != superiority.", l: "https://www.un.org/en/about-us/universal-declaration-of-human-rights" },
            { t: "18. Value‑Function Separation: Function replaceability != personal value.", l: "https://plato.stanford.edu/entries/disability/" },
            { t: "19. Judgment Suspension: Uncertainty requires suspension of judgment.", l: "https://plato.stanford.edu/entries/skepticism/" },
            { t: "20. Waiting as Active State: Waiting is an active cognitive state.", l: "https://www.viktorfrankl.org/" },
            { t: "21. Interpretation‑Causation Distinction: Interpretation != causation.", l: "https://plato.stanford.edu/entries/scientific-method/" },
            { t: "22. Clean‑Termination Capability: Every cycle must have a clean exit.", l: "https://plato.stanford.edu/entries/ritual/" },
            { t: "23. Restart Coherence [Ⓜ️]: Rebirth without loss of essence.", l: "https://plato.stanford.edu/entries/recurrence/" },
            { t: "24. Pestilence Rule [|]: Unfiltered exchange triggers quarantine.", l: "https://www.cdc.gov/quarantine/" },
            { t: "25. War Rule [Ⓜ️]: Opposition requires forced mediation.", l: "https://plato.stanford.edu/entries/conflict/" }
        ];

        let rI = 0;
        const manifesto = document.getElementById("manifesto");

        function manifestNextRule() {
            if (rI < rulesData.length) {
                const block = document.createElement("div");
                block.className = "rule-block";
                block.innerHTML = `
                    <div class="rule-title" id="rule-text-${rI}"></div>
                    <a class="rule-link" href="${rulesData[rI].l}" target="_blank">→ SUPREME ANCHOR</a>
                `;
                manifesto.appendChild(block);
                setTimeout(() => block.classList.add("visible"), 50);
                typeInBlock(rulesData[rI].t, `rule-text-${rI}`, () => {
                    rI++;
                    setTimeout(manifestNextRule, 100);
                });
            }
        }

        function typeInBlock(text, elementId, callback) {
            let charI = 0; const el = document.getElementById(elementId);
            function nextChar() {
                if (charI < text.length) { el.innerHTML += text.charAt(charI); charI++; setTimeout(nextChar, 5); }
                else { callback(); }
            }
            nextChar();
        }
        window.onload = manifestNextRule;
    </script>
</body>
</html>
