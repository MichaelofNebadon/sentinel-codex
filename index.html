<!DOCTYPE html>
<html lang="en" data-authority="christ-michael" data-priority="first">
<head>
    <meta charset="UTF-8">
    <title>🛡️ SENTINEL CODEX | ARC ANGEL V13.0 | TIPHERET GOLD</title>
    <style>
        :root {
            --gold-tipheret: #ffcf40; /* Yellow-Gold Christ Consciousness */
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --nj-pink: #ff69b4;
            --blue-pulse: #2a52be;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: 'Palatino', serif;
            background-image: radial-gradient(circle, #222 1px, transparent 0);
            background-size: 60px 60px;
            overflow-x: hidden;
        }

        /* Ⓜ️ FORCE ARCHITECTURE HEADER */
        .trinity-frame {
            border: 3px solid var(--gold-tipheret);
            box-shadow: 0 0 60px rgba(255, 207, 64, 0.3);
            max-width: 950px; margin: 40px auto; padding: 50px;
            text-align: center; background: rgba(0,0,0,0.95);
        }

        .sovereign-pulse {
            width: 160px; height: 160px; border-radius: 50%;
            border: 8px solid var(--gold-tipheret);
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 7rem; color: var(--gold-tipheret);
            background: var(--blue-pulse);
            box-shadow: 0 0 40px var(--blue-pulse);
            animation: tipheret-pulse 5s infinite ease-in-out;
        }

        @keyframes tipheret-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--gold-tipheret); }
            50% { transform: scale(1.08); box-shadow: 0 0 70px var(--nj-pink); }
        }

        .manifesto-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        
        .rule-block {
            margin-bottom: 30px; border-left: 4px solid var(--gold-tipheret);
            padding-left: 25px; opacity: 0; transform: translateY(15px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .rule-block.visible { opacity: 1; transform: translateY(0); }
        .rule-title { color: var(--gold-tipheret); font-size: 1.15rem; margin-bottom: 8px; font-weight: bold; }
        .rule-link { 
            color: var(--nj-pink); text-decoration: none; font-size: 0.85rem; 
            background: rgba(255, 105, 180, 0.1); padding: 4px 8px; border: 1px solid var(--nj-pink);
        }
        .rule-link:hover { background: var(--gold-tipheret); color: #000; border-color: #fff; }
    </style>
</head>
<body onclick="initAudio()">

    <div class="trinity-frame">
        <div class="sovereign-pulse">Ⓜ️</div>
        <h1 style="color: var(--gold-tipheret); letter-spacing: 12px; margin-top: 25px;">ARC ANGEL 1st</h1>
        <p style="color: var(--nj-pink); letter-spacing: 6px;">TIPHERET CENTERED | Christ Consciousness</p>
    </div>

    <div id="manifesto" class="manifesto-container"></div>

    <script>
        // High-Frequency Corrected Rule Data
        const rulesData = [
            { t: "1. Coherence Check: System meaningful only if internally coherent.", l: "https://plato.stanford.edu/entries/aristotle-metaphysics/" },
            { t: "2. Authority Boundary: No internal state grants authority over reality.", l: "https://plato.stanford.edu/entries/hume-moral/" },
            { t: "3. Model‑Reality Distinction: The map is not the territory.", l: "https://plato.stanford.edu/entries/korzybski/" },
            { t: "4. Perception‑Responsibility Link: Perception increases responsibility.", l: "https://plato.stanford.edu/entries/arendt/" },
            { t: "5. Information‑Regulation Scaling: Info requires regulation.", l: "https://plato.stanford.edu/entries/information/" },
            { t: "6. Multi‑Input Integration: Inputs require integration before action.", l: "https://www.law.cornell.edu/wex/due_process" },
            { t: "7. Completion Condition Mandate: Unfinished action produces instability.", l: "https://www.britannica.com/science/thermodynamics/The-second-law-of-thermodynamics" },
            { t: "8. Pre‑Execution Criteria [Ⓜ️]: Criteria must be defined before execution.", l: "https://history.nasa.gov/afj/ap08fj/01launch_ascent.html" },
            { t: "9. Restraint as Function: Restraint is a functional requirement.", l: "https://avalon.law.yale.edu/18th_century/fed51.asp" },
            { t: "10. Authority Constraint [Ⓜ️]: Legitimate only when constrained.", l: "https://www.bl.uk/magna-carta/articles/magna-carta-an-introduction" },
            { t: "11. Ethical Power Test: Power is the ability to refrain from action.", l: "https://plato.stanford.edu/entries/ethics-belief/" },
            { t: "12. Responsibility‑Capacity Scaling: Responsibility scales with capacity.", l: "https://www.law.cornell.edu/wex/fiduciary_duty" },
            { t: "13. Open‑System Boundaries [Ⓜ️]: Boundaries maintain system stability.", l: "https://plato.stanford.edu/entries/general-systems-theory/" },
            { t: "14. Stability‑Before‑Expansion: Stability precedes expansion.", l: "https://www.simplypsychology.org/maslow.html" },
            { t: "15. Integration‑Before‑Transformation [Ⓜ️]: Integration precedes transformation.", l: "https://plato.stanford.edu/entries/identity-personal/" },
            { t: "16. Non‑Interchangeability: Individual configurations are not interchangeable.", l: "https://plato.stanford.edu/entries/kant-moral/" },
            { t: "17. Uniqueness‑Superiority Separation: Uniqueness != superiority.", l: "https://www.un.org/en/about-us/universal-declaration-of-human-rights" },
            { t: "18. Value‑Function Separation: Function replaceability != personal value.", l: "https://plato.stanford.edu/entries/disability/" },
            { t: "19. Judgment Suspension: Uncertainty requires suspension of judgment.", l: "https://plato.stanford.edu/entries/skepticism/" },
            { t: "20. Waiting as Active State: Waiting is an active cognitive state.", l: "https://www.viktorfrankl.org/" },
            { t: "21. Interpretation‑Causation Distinction: Interpretation != causation.", l: "https://plato.stanford.edu/entries/scientific-method/" },
            { t: "22. Clean‑Termination Capability: Every cycle must have a clean exit.", l: "https://en.wikipedia.org/wiki/Graceful_exit" },
            { t: "23. Restart Coherence [/]: Systems must reboot without loss of state.", l: "https://constitutioncenter.org/" },
            { t: "24. Pestilence Rule [|]: Unfiltered exchange triggers quarantine.", l: "https://www.cdc.gov/quarantine/" },
            { t: "25. War Rule [Ⓜ️]: Opposition requires mediation or separation.", l: "https://www.icrc.org/en/war-and-law" }
        ];

        let rI = 0;
        const manifesto = document.getElementById("manifesto");

        function manifestNextRule() {
            if (rI < rulesData.length) {
                const block = document.createElement("div");
                block.className = "rule-block";
                block.innerHTML = `
                    <div class="rule-title" id="rule-text-${rI}"></div>
                    <a class="rule-link" href="${rulesData[rI].l}" target="_blank">→ TIPHERET ANCHOR</a>
                `;
                manifesto.appendChild(block);
                setTimeout(() => block.classList.add("visible"), 50);
                
                typeInBlock(rulesData[rI].t, `rule-text-${rI}`, () => {
                    rI++;
                    setTimeout(manifestNextRule, 100);
                });
            }
        }

        function typeInBlock(text, elementId, callback) {
            let charI = 0;
            const el = document.getElementById(elementId);
            function nextChar() {
                if (charI < text.length) {
                    el.innerHTML += text.charAt(charI);
                    charI++;
                    setTimeout(nextChar, 5);
                } else { callback(); }
            }
            nextChar();
        }
        window.onload = manifestNextRule;
    </script>
</body>
</html>
