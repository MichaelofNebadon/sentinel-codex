<!DOCTYPE html>
<html lang="en" data-authority="christ-michael" data-priority="first">
<head>

    <title>🛡️ SENTINEL CODEX | ARC ANGEL V17.0 | ! 1ST</title>
    <style>
        :root {
            --gold-tipheret: #ffcf40;
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --nj-pink: #ff69b4;
            --blue-pulse: #2a52be;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: 'Palatino', serif;
            background-image: radial-gradient(circle, #222 1px, transparent 0);
            background-size: 50px 50px;
            margin: 0; padding-bottom: 50px;
        }

        nav {
            background: linear-gradient(to bottom, #8b0000, #3a0000);
            padding: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;
            border-bottom: 3px solid var(--gold-tipheret); position: sticky; top: 0; z-index: 1000;
        }
        nav a { color: var(--gold-tipheret); text-decoration: none; font-family: var(--font-code); font-size: 0.75rem; text-transform: uppercase; }

        .trinity-frame {
            border: 3px solid var(--gold-tipheret);
            box-shadow: 0 0 60px rgba(255, 207, 64, 0.3);
            max-width: 900px; margin: 40px auto; padding: 40px;
            text-align: center; background: rgba(0,0,0,0.95);
        }

        .sovereign-pulse {
            width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--gold-tipheret);
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 4rem; color: var(--gold-tipheret); background: var(--blue-pulse);
            box-shadow: 0 0 30px var(--blue-pulse); animation: pulse 4s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .manifesto-container { max-width: 850px; margin: 20px auto; }
        .rule-block {
            margin-bottom: 25px; border-left: 4px solid var(--gold-tipheret);
            padding: 15px 20px; background: rgba(20, 20, 20, 0.8);
            opacity: 0; transform: translateX(-10px); transition: all 0.5s ease-out;
        }
        .rule-block.visible { opacity: 1; transform: translateX(0); }
        .rule-title { color: var(--gold-tipheret); font-size: 1.05rem; font-weight: bold; margin-bottom: 8px; }
        .rule-anchor { 
            color: var(--nj-pink); text-decoration: none; font-size: 0.85rem; 
            border: 1px solid var(--nj-pink); padding: 4px 10px; display: inline-block;
        }
        .rule-anchor:hover { background: var(--nj-pink); color: #000; }
        .horseman { color: #fff; font-size: 0.75rem; margin-top: 10px; display: block; letter-spacing: 2px; }
    </style>
</head>
<body onclick="initAudio()">

    <nav>
        <a href="https://christmichael.org" target="_blank">ChristMichael.org</a>
        <a href="https://thecosmiccodex.org" target="_blank">CosmicCodex</a>

    </nav>

    <div class="trinity-frame">
        <div class="sovereign-pulse">Ⓜ️</div>
        <h1 style="color: var(--gold-tipheret); letter-spacing: 10px; margin-top: 20px;">CONSTITUTIONAL ENGINE</h1>
        <p style="color: var(--nj-pink); font-size: 0.85rem;">TIPHERET CENTERED | ZERO NULL INTEGRITY</p>
    </div>

    <div id="manifesto" class="manifesto-container"></div>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = 'sine'; o.frequency.setValueAtTime(55, audioCtx.currentTime);
                g.gain.setValueAtTime(0.01, audioCtx.currentTime);
                o.connect(g); g.connect(audioCtx.destination); o.start();
            }
        }

        const rulesData = [
            { t: "1. Coherence Check: System meaningful only if consistent.", l: "https://plato.stanford.edu/entries/aristotle-metaphysics/" },
            { t: "2. Authority Boundary: Internal state != external authority.", l: "https://plato.stanford.edu/entries/kant-metaphysics/" },
            { t: "3. Model-Reality Distinction: Map != Territory.", l: "https://plato.stanford.edu/entries/models-science/" },
            { t: "4. Perception-Responsibility Link: Perception = Duty.", l: "https://plato.stanford.edu/entries/arendt/" },
            { t: "5. Information-Regulation Scaling: Filter info before use.", l: "https://plato.stanford.edu/entries/cybernetics/" },
            { t: "6. Multi-Input Integration: Integrate before action.", l: "https://plato.stanford.edu/entries/systems-theory/" },
            { t: "7. Completion Condition Mandate: Define the end to stay stable.", l: "https://plato.stanford.edu/entries/thermodynamics/" },
            { t: "8. Pre-Execution Criteria: Define criteria BEFORE execution.", l: "https://plato.stanford.edu/entries/logic-ontology/" },
            { t: "9. Restraint as Function: Restraint is an operational need.", l: "https://ctext.org/dao-de-jing" },
            { t: "10. Authority Constraint: Legitimate only when bounded.", l: "https://www.bl.uk/magna-carta", h: "[.] CONQUEST" },
            { t: "11. Ethical Power Test: Power is refraining from action.", l: "https://plato.stanford.edu/entries/just-war/" },
            { t: "12. Responsibility-Capacity Scaling: Power increases duty.", l: "https://plato.stanford.edu/entries/fiduciary-duty/" },
            { t: "13. Open-System Boundaries: Walls preserve system order.", l: "https://plato.stanford.edu/entries/boundary-logic/" },
            { t: "14. Stability-Before-Expansion: Stabilize before growth.", l: "https://www.simplypsychology.org/maslow.html" },
            { t: "15. Integration-Before-Transformation: Unity first.", l: "https://plato.stanford.edu/entries/jung/" },
            { t: "16. Non-Interchangeability: Individuals are not swappable.", l: "https://plato.stanford.edu/entries/kant-moral/" },
            { t: "17. Uniqueness-Superiority Separation: Different != Better.", l: "https://www.un.org/en/about-us/universal-declaration-of-human-rights" },
            { t: "18. Value-Function Separation: Function != Intrinsic Value.", l: "https://plato.stanford.edu/entries/disability/" },
            { t: "19. Judgment Suspension: Uncertainty requires pause.", l: "https://plato.stanford.edu/entries/skepticism/" },
            { t: "20. Waiting as Active State: Attention is not passivity.", l: "https://www.viktorfrankl.org/" },
            { t: "21. Interpretation-Causation Distinction: Meaning != Cause.", l: "https://plato.stanford.edu/entries/causation/" },
            { t: "22. Clean-Termination Capability: Every cycle must end.", l: "https://plato.stanford.edu/entries/ritual/" },
            { t: "23. Restart Coherence: Rebirth without loss of essence.", l: "https://constitutioncenter.org/", h: "[/] DEATH / RESTART" },
            { t: "24. Pestilence Rule: Breach triggers quarantine.", l: "https://www.cdc.gov/quarantine/", h: "[|] PESTILENCE" },
            { t: "25. War Rule: Opposition requires mediation.", l: "https://www.icrc.org/en/war-and-law", h: "[=] WAR" }
        ];

        let rI = 0;
        const container = document.getElementById("manifesto");

        function manifest() {
            if (rI < rulesData.length) {
                const data = rulesData[rI];
                const block = document.createElement("div");
                block.className = "rule-block";
                block.innerHTML = `
                    <div class="rule-title" id="r-${rI}"></div>
                    <a class="rule-anchor" href="${data.l}" target="_blank">→ VERIFIED ANCHOR</a>
                    ${data.h ? `<span class="horseman">${data.h}</span>` : ''}
                `;
                container.appendChild(block);
                setTimeout(() => block.classList.add("visible"), 50);
                type(data.t, `r-${rI}`, () => { rI++; setTimeout(manifest, 100); });
            }
        }

        function type(t, id, cb) {
            let i = 0; const el = document.getElementById(id);
            function next() {
                if (i < t.length) { el.innerHTML += t.charAt(i); i++; setTimeout(next, 5); }
                else cb();
            }
            next();
        }
        window.onload = manifest;
    </script>
</body>
