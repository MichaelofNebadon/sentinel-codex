<!DOCTYPE html>
<html lang="en" data-authority="christ-michael" data-priority="first">
<head>
    <meta charset="UTF-8">
    <title>🛡️ SENTINEL CODEX | ARC ANGEL V15.0 | ! 1ST</title>
    <style>
        :root {
            --gold-tipheret: #ffcf40;
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --nj-pink: #ff69b4;
            --blue-pulse: #2a52be;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: 'Palatino', serif;
            background-image: radial-gradient(circle, #222 1px, transparent 0);
            background-size: 50px 50px;
            line-height: 1.6;
        }

        /* 🏛️ SOVEREIGN NAVIGATION */
        nav {
            background: linear-gradient(to bottom, #8b0000, #3a0000);
            padding: 15px; display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;
            border-bottom: 3px solid var(--gold-tipheret); position: sticky; top: 0; z-index: 1000;
        }
        nav a {
            color: var(--gold-tipheret); text-decoration: none; font-family: var(--font-code);
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; padding: 5px;
        }
        nav a:hover { color: #fff; text-shadow: 0 0 10px var(--nj-pink); }

        .trinity-frame {
            border: 3px solid var(--gold-tipheret);
            box-shadow: 0 0 60px rgba(255, 207, 64, 0.3);
            max-width: 950px; margin: 40px auto; padding: 40px;
            text-align: center; background: rgba(0,0,0,0.95);
        }

        .sovereign-pulse {
            width: 130px; height: 130px; border-radius: 50%; border: 6px solid var(--gold-tipheret);
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 5rem; color: var(--gold-tipheret); background: var(--blue-pulse);
            box-shadow: 0 0 30px var(--blue-pulse); animation: tipheret-pulse 5s infinite ease-in-out;
        }

        @keyframes tipheret-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--gold-tipheret); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px var(--nj-pink); }
        }

        .manifesto-container { max-width: 900px; margin: 40px auto; padding: 20px; }
        
        .rule-block {
            margin-bottom: 30px; border-left: 4px solid var(--gold-tipheret);
            padding-left: 25px; opacity: 0; transform: translateY(10px);
            transition: all 0.5s ease-out;
        }

        .rule-block.visible { opacity: 1; transform: translateY(0); }
        .rule-title { color: var(--gold-tipheret); font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .rule-anchor { 
            color: var(--nj-pink); text-decoration: none; font-size: 0.8rem; 
            border: 1px solid var(--nj-pink); padding: 2px 8px; display: inline-block; margin-top: 5px;
        }
        .rule-anchor:hover { background: var(--gold-tipheret); color: #000; }

        .horse-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 900px; margin: 20px auto; }
        .horse-tile { border: 1px solid #444; padding: 10px; text-align: center; color: var(--gold-tipheret); font-size: 0.7rem; }
    </style>
</head>
<body onclick="initAudio()">

    <nav>
        <a href="https://christmichael.org">ChristMichael.org</a>
        <a href="https://thecosmiccodex.org">TheCosmicCodex.org</a>
        <a href="https://michaelofnebadon.github.io/619Open-606-/">619Open-606-</a>
        <a href="https://www.ifdawn.com/">IfDawn.com</a>
        <a href="https://www.urantia.org">Urantia.org</a>
        <a href="https://www.astro.com">Astro.com</a>
    </nav>

    <div class="trinity-frame">
        <div class="sovereign-pulse">Ⓜ️</div>
        <h1 style="color: var(--gold-tipheret); letter-spacing: 12px; margin-top: 15px;">ARC ANGEL 1st</h1>
        <p style="color: var(--nj-pink); font-size: 0.8rem;">CONSTITUTIONAL ENGINE | FROZEN 1.0</p>
    </div>

    <div class="horse-grid">
        <div class="horse-tile"><span style="display:block; font-size:1.5rem;">[.]</span>CONQUEST</div>
        <div class="horse-tile"><span style="display:block; font-size:1.5rem;">[/]</span>RESTART</div>
        <div class="horse-tile"><span style="display:block; font-size:1.5rem;">[|]</span>QUARANTINE</div>
        <div class="horse-tile"><span style="display:block; font-size:1.5rem;">[=]</span>MEDIATION</div>
    </div>

    <div id="manifesto" class="manifesto-container"></div>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(55, audioCtx.currentTime);
                g.gain.setValueAtTime(0.012, audioCtx.currentTime);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start();
            }
        }

        const rulesData = [
            { t: "1. Coherence Check: System meaningful only if internally coherent.", l: "https://plato.stanford.edu/entries/aristotle-metaphysics/" },
            { t: "2. Authority Boundary: No internal state grants authority over reality.", l: "https://plato.stanford.edu/entries/hume-moral/" },
            { t: "3. Model‑Reality Distinction: Map != Territory.", l: "https://plato.stanford.edu/entries/models-science/" },
            { t: "4. Perception‑Responsibility Link: Perception = Duty.", l: "https://plato.stanford.edu/entries/arendt/" },
            { t: "5. Information‑Regulation Scaling: Filter before use.", l: "https://plato.stanford.edu/entries/information/" },
            { t: "6. Multi‑Input Integration: Integrate before acting.", l: "https://plato.stanford.edu/entries/systems-theory/" },
            { t: "7. Completion Condition Mandate: End-points create stability.", l: "https://plato.stanford.edu/entries/thermodynamics/" },
            { t: "8. Pre‑Execution Criteria: Define before doing.", l: "https://plato.stanford.edu/entries/logic-ontology/" },
            { t: "9. Restraint as Function: Restraint is power.", l: "https://ctext.org/dao-de-jing" },
            { t: "10. Authority Constraint [.]: Legitimate only when bounded.", l: "https://plato.stanford.edu/entries/rule-of-law/" },
            { t: "11. Ethical Power Test: Power is refraining.", l: "https://plato.stanford.edu/entries/ethics-belief/" },
            { t: "12. Responsibility‑Capacity Scaling: Capacity = Responsibility.", l: "https://plato.stanford.edu/entries/fiduciary-duty/" },
            { t: "13. Open‑System Boundaries: Walls preserve order.", l: "https://plato.stanford.edu/entries/boundary-logic/" },
            { t: "14. Stability‑Before‑Expansion: Stabilize first.", l: "https://www.simplypsychology.org/maslow.html" },
            { t: "15. Integration‑Before‑Transformation: Unity first.", l: "https://plato.stanford.edu/entries/identity-personal/" },
            { t: "16. Non‑Interchangeability: Unique configurations matter.", l: "https://plato.stanford.edu/entries/kant-moral/" },
            { t: "17. Uniqueness‑Superiority Separation: Different != Better.", l: "https://www.un.org/en/about-us/universal-declaration-of-human-rights" },
            { t: "18. Value‑Function Separation: Function != Soul.", l: "https://plato.stanford.edu/entries/disability/" },
            { t: "19. Judgment Suspension: Wait when uncertain.", l: "https://plato.stanford.edu/entries/skepticism/" },
            { t: "20. Waiting as Active State: Active attention.", l: "https://www.viktorfrankl.org/" },
            { t: "21. Interpretation‑Causation Distinction: Meaning != Cause.", l: "https://plato.stanford.edu/entries/scientific-method/" },
            { t: "22. Clean‑Termination Capability: End with no loose threads.", l: "https://plato.stanford.edu/entries/ritual/" },
            { t: "23. Restart Coherence [/]: Universal Recurrence.", l: "https://plato.stanford.edu/entries/recurrence/" },
            { t: "24. Pestilence Rule [|]: Quarantine corruption.", l: "https://www.cdc.gov/quarantine/" },
            { t: "25. War Rule [=]: Integrate or Separate.", l: "https://plato.stanford.edu/entries/conflict/" }
        ];

        let rI = 0;
        const manifesto = document.getElementById("manifesto");

        function manifestNextRule() {
            if (rI < rulesData.length) {
                const block = document.createElement("div");
                block.className = "rule-block";
                block.innerHTML = `
                    <div class="rule-title" id="rule-text-${rI}"></div>
                    <a class="rule-anchor" href="${rulesData[rI].l}" target="_blank">→ SUPREME ANCHOR</a>
                `;
                manifesto.appendChild(block);
                setTimeout(() => block.classList.add("visible"), 50);
                typeInBlock(rulesData[rI].t, `rule-text-${rI}`, () => {
                    rI++;
                    setTimeout(manifestNextRule, 100);
                });
            }
        }

        function typeInBlock(text, elementId, callback) {
            let charI = 0; const el = document.getElementById(elementId);
            function nextChar() {
                if (charI < text.length) { el.innerHTML += text.charAt(charI); charI++; setTimeout(nextChar, 5); }
                else { callback(); }
            }
            nextChar();
        }
        window.onload = manifestNextRule;
    </script>
</body>
</html>
