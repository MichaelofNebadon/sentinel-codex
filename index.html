    <style>
        :root {
            --gold: #c9a959;
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --crimson: #8b0000;
            --nj-pink: #ff69b4;
            --blue-pulse: #2a52be;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: 'Palatino', serif;

            overflow-x: hidden;

        /* 🏛️ AUDIO-NAVIGATION */
        nav {
            background: linear-gradient(to bottom, var(--crimson), #3a0000);
            padding: 15px; display: flex; justify-content: center; gap: 20px;
            border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000;
        }
        nav a {
            color: var(--gold); text-decoration: none; font-family: var(--font-code);
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
        }
        nav a:hover { color: #fff; text-shadow: 0 0 10px var(--nj-pink); }

        /* 🐉 SOVEREIGN CENTER */
        .trinity-frame {
            border: 2px solid var(--nj-pink);
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.2);
            max-width: 900px; margin: 40px auto; padding: 40px 20px;
            text-align: center; background: rgba(0,0,0,0.9);
        }
        .sovereign-pulse {
            width: 160px; height: 160px; border-radius: 50%; border: 5px solid #fff;
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 5.5rem; color: #fff; background: var(--blue-pulse);
            box-shadow: 0 0 30px var(--blue-pulse);
            animation: pulse-engine 4s infinite ease-in-out;
            margin-bottom: 20px;
        }
        @keyframes pulse-engine {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--blue-pulse); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px var(--nj-pink); }
        }

        /* 🐘 THE 25 RULES TERMINAL */
        .rules-terminal {
            max-width: 850px; margin: 40px auto;
            min-height: 200px; padding: 40px;
            background: #050505; border: 1px solid #222;
            font-family: var(--font-code); border-left: 5px solid var(--gold);
            position: relative;
        }
        #typewriter-text { font-size: 1.1rem; color: var(--gold); line-height: 1.6; }
        .anchor-link {
            display: block; margin-top: 20px; color: var(--nj-pink);
            text-decoration: none; font-size: 0.8rem; border-bottom: 1px dashed var(--nj-pink);
            width: fit-content;
        }
        .anchor-link:hover { color: #fff; border-color: #fff; }

        /* 🏺 HORSEMEN INTERFACE */
        .horse-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; max-width: 850px; margin: 20px auto;
        }
        .horse-tile {
            border: 1px solid #333; padding: 10px; text-align: center;
            font-family: var(--font-code); font-size: 0.7rem; color: var(--nj-pink);
        }
        .symbol { font-size: 1.5rem; color: #fff; display: block; }
    </style>
</head>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(55, audioCtx.currentTime);
                g.gain.setValueAtTime(0.015, audioCtx.currentTime);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start();
            }
        }
        function playBlip() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(880, audioCtx.currentTime);
            g.gain.setValueAtTime(0.05, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        const rulesData = [
            { t: "1. Coherence Check: A system is meaningful only if internally coherent.", l: "https://plato.stanford.edu/entries/aristotle-metaphysics/" },
            { t: "2. Authority Boundary: No internal state grants authority over reality.", l: "https://plato.stanford.edu/entries/hume-moral/" },
            { t: "3. Model‑Reality Distinction: The map is not the territory.", l: "https://www.generalsemantics.org/map-territory/" },
            { t: "10. Authority Constraint [.]: Legitimate only when constrained.", l: "https://www.bl.uk/magna-carta" },
            { t: "12. Responsibility‑Capacity Scaling: Responsibility scales with capacity.", l: "https://plato.stanford.edu/entries/singer/" },
            { t: "23. Restart Coherence [/]: Systems must reboot without loss of state.", l: "https://constitutioncenter.org/" },
            { t: "24. Pestilence Rule [|]: Unfiltered exchange triggers quarantine.", l: "https://www.cdc.gov/quarantine/" },
            { t: "25. War Rule [=]: Opposition requires mediation or separation.", l: "https://www.icrc.org/en/war-and-law" }
        ];

        let rI = 0; let cI = 0;
        const textDisp = document.getElementById("typewriter-text");
        const linkDisp = document.getElementById("rule-anchor");

        function type() {
            if (cI < rulesData[rI].t.length) {
                textDisp.innerHTML += rulesData[rI].t.charAt(cI);
                cI++;
                setTimeout(type, 30);
            } else {
                linkDisp.href = rulesData[rI].l;
                linkDisp.style.opacity = "1";
                setTimeout(erase, 5000);
            }
        }
        function erase() {
            linkDisp.style.opacity = "0";
            if (cI > 0) {
                textDisp.innerHTML = rulesData[rI].t.substring(0, cI - 1);
                cI--;
                setTimeout(erase, 10);
            } else {
                rI = (rI + 1) % rulesData.length;
                setTimeout(type, 500);
            }
        }
        window.onload = type;
    </script>
