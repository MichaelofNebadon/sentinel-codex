<!DOCTYPE html>

    <style>
        :root {
            --gold: #c9a959;
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --crimson: #8b0000;
            --nj-pink: #ff69b4;
            --blue-pulse: #2a52be;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: 'Palatino', serif;
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 0);
            background-size: 50px 50px;
        }

        nav {
            background: linear-gradient(to bottom, var(--crimson), #3a0000);
            padding: 15px; display: flex; justify-content: center; gap: 20px;
            border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000;
        }
        nav a { color: var(--gold); text-decoration: none; font-family: var(--font-code); font-size: 0.75rem; letter-spacing: 2px; }

        .trinity-frame {
            border: 2px solid var(--nj-pink);
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.2);
            max-width: 900px; margin: 40px auto; padding: 40px;
            text-align: center; background: rgba(0,0,0,0.9);
        }
        .sovereign-pulse {
            width: 140px; height: 140px; border-radius: 50%; border: 5px solid #fff;
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 5rem; color: #fff; background: var(--blue-pulse);
            box-shadow: 0 0 30px var(--blue-pulse);
            animation: pulse-engine 4s infinite ease-in-out;
        }
        @keyframes pulse-engine {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px var(--blue-pulse); }
            50% { transform: scale(1.05); box-shadow: 0 0 60px var(--nj-pink); }
        }

        .manifesto-container { max-width: 900px; margin: 40px auto; padding: 20px; font-family: var(--font-code); }
        .rule-block {
            margin-bottom: 25px; border-left: 3px solid var(--gold);
            padding-left: 20px; opacity: 0; transform: translateX(-10px);
            transition: all 0.4s ease;
        }
        .rule-block.visible { opacity: 1; transform: translateX(0); }
        .rule-title { color: var(--gold); font-size: 1rem; margin-bottom: 5px; }
        .rule-link { color: var(--nj-pink); text-decoration: none; font-size: 0.75rem; border-bottom: 1px dashed var(--nj-pink); }
        .rule-link:hover { color: #fff; border-color: #fff; }

        .horse-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 900px; margin: 20px auto; }
        .horse-tile { border: 1px solid #333; padding: 10px; text-align: center; color: var(--nj-pink); font-size: 0.7rem; }
    </style>
</head>
<body onclick="initAudio()">

    <nav>
        <a href="https://www.christmichael.org" onmouseover="playBlip()">Christ Michael</a>
        <a href="https://www.thecosmiccodex.org" onmouseover="playBlip()">Cosmic Codex</a>

    <div id="manifesto" class="manifesto-container"></div>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(55, audioCtx.currentTime);
                g.gain.setValueAtTime(0.012, audioCtx.currentTime);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start();
            }
        }
        function playBlip() {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(900, audioCtx.currentTime);
            g.gain.setValueAtTime(0.03, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + 0.1);
        }

        const rulesData = [
            { t: "1. Coherence Check: A system is meaningful only if internally coherent.", l: "https://plato.stanford.edu/entries/aristotle-metaphysics/" },
            { t: "2. Authority Boundary: No internal state grants authority over reality.", l: "https://plato.stanford.edu/entries/hume-moral/" },
            { t: "3. Model‑Reality Distinction: The map is not the territory.", l: "https://www.generalsemantics.org/" },
            { t: "4. Perception‑Responsibility Link: Perception increases responsibility.", l: "https://plato.stanford.edu/entries/arendt/" },
            { t: "5. Information‑Regulation Scaling: Info requires regulation.", l: "https://plato.stanford.edu/entries/cybernetics/" },
            { t: "6. Multi‑Input Integration: Inputs require integration before action.", l: "https://plato.stanford.edu/entries/systems-theory/" },
            { t: "7. Completion Condition Mandate: Unfinished action produces instability.", l: "https://plato.stanford.edu/entries/thermodynamics/" },
            { t: "8. Pre‑Execution Criteria: Criteria must be defined before execution.", l: "https://www.jcs.mil/Doctrine/" },
            { t: "9. Restraint as Function: Restraint is a functional requirement.", l: "https://ctext.org/dao-de-jing" },
            { t: "10. Authority Constraint [.]: Legitimate only when constrained.", l: "https://www.bl.uk/magna-carta" },
            { t: "11. Ethical Power Test: Power is the ability to refrain from action.", l: "https://plato.stanford.edu/entries/just-war/" },
            { t: "12. Responsibility‑Capacity Scaling: Responsibility scales with capacity.", l: "https://plato.stanford.edu/entries/singer/" },
            { t: "13. Open‑System Boundaries: Boundaries maintain system stability.", l: "https://plato.stanford.edu/entries/feedback/" },
            { t: "14. Stability‑Before‑Expansion: Stability precedes expansion.", l: "https://www.simplypsychology.org/maslow.html" },
            { t: "15. Integration‑Before‑Transformation: Integration precedes transformation.", l: "https://plato.stanford.edu/entries/jung/" },
            { t: "16. Non‑Interchangeability: Individual configurations are not interchangeable.", l: "https://plato.stanford.edu/entries/kant-moral/" },
            { t: "17. Uniqueness‑Superiority Separation: Uniqueness != superiority.", l: "https://www.un.org/en/about-us/universal-declaration-of-human-rights" },
            { t: "18. Value‑Function Separation: Function replaceability != personal value.", l: "https://plato.stanford.edu/entries/disability/" },
            { t: "19. Judgment Suspension: Uncertainty requires suspension of judgment.", l: "https://plato.stanford.edu/entries/skepticism/" },
            { t: "20. Waiting as Active State: Waiting is an active cognitive state.", l: "https://www.viktorfrankl.org/" },
            { t: "21. Interpretation‑Causation Distinction: Interpretation != causation.", l: "https://plato.stanford.edu/entries/causation/" },
            { t: "22. Clean‑Termination Capability: Every cycle must have a clean exit.", l: "https://en.wikipedia.org/wiki/Graceful_shutdown" },
            { t: "23. Restart Coherence [/]: Systems must reboot without loss of state.", l: "https://constitutioncenter.org/" },
            { t: "24. Pestilence Rule [|]: Unfiltered exchange triggers quarantine.", l: "https://www.cdc.gov/quarantine/" },
            { t: "25. War Rule [=]: Opposition requires mediation or separation.", l: "https://www.icrc.org/en/war-and-law" }
        ];

        let rI = 0;
        const manifesto = document.getElementById("manifesto");

        function manifestNextRule() {
            if (rI < rulesData.length) {
                const block = document.createElement("div");
                block.className = "rule-block";
                block.innerHTML = `
                    <div class="rule-title" id="rule-text-${rI}"></div>
                    <a class="rule-link" href="${rulesData[rI].l}" target="_blank">→ VIEW ANCHOR</a>
                `;
                manifesto.appendChild(block);
                setTimeout(() => block.classList.add("visible"), 50);
                
                typeInBlock(rulesData[rI].t, `rule-text-${rI}`, () => {
                    rI++;
                    setTimeout(manifestNextRule, 200);
                });
            }
        }

        function typeInBlock(text, elementId, callback) {
            let charI = 0;
            const el = document.getElementById(elementId);
            function nextChar() {
                if (charI < text.length) {
                    el.innerHTML += text.charAt(charI);
                    charI++;
                    setTimeout(nextChar, 15);
                } else { callback(); }
            }
            nextChar();
        }

        window.onload = manifestNextRule;
    </script>
